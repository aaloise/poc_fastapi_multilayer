services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POC_DEBUG=false
      - POC_DB_URL=sqlite+aiosqlite:///./poc.db
      - POC_QUEUE_CONCURRENCY=8
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Prefect server
  prefect:
    image: prefecthq/prefect:3-python3.13
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
    profiles:
      - prefect

  # Optional: Redis (for Queuefy)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - redis

volumes:
  app-data:
